name: MiniAssist Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniassist-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MiniAssist for Minecraft 1.21.4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Validate project layout
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle || test -f build.gradle.kts || { echo "ERROR: build.gradle is missing from repository root"; exit 1; }
          test -d src/main || { echo "ERROR: src/main is missing from repository root"; exit 1; }
          test -f src/main/resources/fabric.mod.json || { echo "ERROR: fabric.mod.json is missing"; exit 1; }
          echo "Java: $(java -version 2>&1 | head -n 1)"
          echo "Gradle: $(gradle --version | grep '^Gradle ' | head -n 1)"
          echo "Project: $GITHUB_WORKSPACE"

      - name: Build MiniAssist
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode all clean build 2>&1 | tee "$RUNNER_TEMP/miniassist-build.log"

      - name: Verify and prepare JAR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          JAR_FILE="build/libs/zenith-client-1.5.0.jar"
          if [ ! -s "$JAR_FILE" ]; then
            echo "ERROR: expected JAR was not created: $JAR_FILE"
            echo "Available JAR files:"
            find build -type f -name '*.jar' -print 2>/dev/null || true
            exit 1
          fi
          jar tf "$JAR_FILE" > "$RUNNER_TEMP/miniassist-jar-contents.txt"
          grep -Fxq 'fabric.mod.json' "$RUNNER_TEMP/miniassist-jar-contents.txt"
          unzip -p "$JAR_FILE" fabric.mod.json | grep -Fq '"version": "1.5.0"'
          mkdir -p artifacts
          cp "$JAR_FILE" artifacts/zenith-client-1.5.0.jar
          echo "Verified JAR: artifacts/zenith-client-1.5.0.jar"

      - name: Upload MiniAssist JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiniAssist-1.5.0
          path: artifacts/zenith-client-1.5.0.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MiniAssist-build-log
          path: ${{ runner.temp }}/miniassist-build.log
          if-no-files-found: ignore
          retention-days: 7
